<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNEA Cutoff Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: azure;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: black;
            color: white;
            padding: 20px 0;
            text-align: center;
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1200px;
            margin: 120px auto 0;
            padding: 20px;
            flex: 1;
        }

        .calculator {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: space-between;
            align-items: flex-start;
        }

        .input-section {
            flex: 1;
            min-width: 300px;
        }

        .result-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #333;
            background-color: bisque;
        }

        input[type="number"]:hover {
            background-color: #f5f5f5;
        }

        button {
            background-color: palegreen;
            color: #333;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background-color: #3cb371;
            transform: translateY(-2px);
        }

        .result-display {
            margin-top: 20px;
            text-align: center;
        }

        #res {
            font-size: 60px;
            color: red;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #com {
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }

        .credit {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            color: #666;
        }

        .all-best {
            font-size: 36px;
            margin-bottom: 10px;
        }

        /* Media Queries */
        @media (max-width: 768px) {
            .calculator {
                flex-direction: column;
            }
            
            .input-section, .result-section {
                width: 100%;
            }
            
            .container {
                margin-top: 100px;
                padding: 15px;
            }
            
            .all-best {
                font-size: 28px;
            }
            
            #res {
                font-size: 48px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 15px 0;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            input[type="number"] {
                padding: 10px;
            }
            
            button {
                padding: 10px 20px;
            }
            
            #res {
                font-size: 42px;
            }
            
            #com {
                font-size: 20px;
            }
            
            .all-best {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>TNEA CUTOFF CALCULATOR</h1>
    </header>

    <div class="container">
        <div class="calculator">
            <div class="input-section">
                <div class="form-group">
                    <input type="number" id="chemistry" placeholder="Enter your chemistry mark here" required min="0" max="100">
                </div>
                <div class="form-group">
                    <input type="number" id="physics" placeholder="Enter your physics mark here" required min="0" max="100">
                </div>
                <div class="form-group">
                    <input type="number" id="maths" placeholder="Enter your maths mark here" required min="0" max="100">
                </div>
                <button type="button" onclick="calculateCutoff()">Calculate Cutoff</button>
            </div>

            <div class="result-section">
                <h2 class="all-best">All The Best 👍</h2>
                <div class="result-display">
                    <div id="res"></div>
                    <div id="com"></div>
                </div>
            </div>
        </div>

        <div class="credit">
            <p>Developed by Mohamed Mydeen</p>
        </div>
    </div>

    <script>
        function calculateCutoff() {
            const chemistry = parseFloat(document.getElementById('chemistry').value) || 0;
            const physics = parseFloat(document.getElementById('physics').value) || 0;
            const maths = parseFloat(document.getElementById('maths').value) || 0;
            
            // Input validation
            if(chemistry > 100 || physics > 100 || maths > 100 || chemistry < 0 || physics < 0 || maths < 0) {
                document.getElementById('res').textContent = "Invalid";
                document.getElementById('com').textContent = "Please enter marks between 0 and 100";
                return;
            }
            
            // Calculate as per TNEA formula
            const avg = (chemistry + physics) / 2;
            const result = avg + maths;
            
            // Display result
            document.getElementById('res').textContent = result.toFixed(2);
            
            // Display comment based on result
            let comment = "";
            if(result >= 180) {
                comment = "Fantastic!";
            } else if(result >= 150) {
                comment = "Nice!";
            } else if(result >= 120) {
                comment = "Good";
            } else {
                comment = "Keep trying!";
            }
            
            document.getElementById('com').textContent = comment;
        }
    </script>
</body>

</html>
